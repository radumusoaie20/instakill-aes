spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:sqlite:./instakill.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      connection-init-sql: "PRAGMA journal_mode=WAL; PRAGMA busy_timeout=5000; PRAGMA synchronous=NORMAL;"
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
server:
  servlet:
    context-path: /
springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger
management:
  endpoints:
    web:
      exposure:
        include: health,info

instakill:
  jwt:
    secret: change-me-change-me-change-me-change-me-change-me-secret-key-1234
    issuer: instakill
    ttl-minutes: 120
  notifications:
    ntfy:
      url: https://ntfy.sh
      topic: instakill-cool-posts
  llm:
    url: ${LOCAL_LLM_URL:}
    host: ${LOCAL_LLM_HOST:localhost}
    port: ${LOCAL_LLM_PORT:12345}
    preferred-model: ${LOCAL_LLM_MODEL:google/gemma-3-270m}
    strategy: ${LOCAL_LLM_STRATEGY:smart}
    timeout-seconds: ${LOCAL_LLM_TIMEOUT_SECONDS:30}
    temperature: ${LOCAL_LLM_TEMPERATURE:0.7}
    max-tokens: ${LOCAL_LLM_MAX_TOKENS:256}
    system-prompt: ${LOCAL_LLM_SYSTEM_PROMPT:Always reply with the user's message, but rewritten in a more funny style.}
logging:
  level:
    org.hibernate.SQL: warn

media:
  base-path: media
