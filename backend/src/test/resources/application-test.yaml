spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:sqlite:file:memdb1?mode=memory&cache=shared
    driver-class-name: org.sqlite.JDBC
    hikari:
      connection-init-sql: "PRAGMA busy_timeout=5000;"
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: create-drop
  main:
    web-application-type: servlet
server:
  servlet:
    context-path: /

instakill:
  jwt:
    secret: test-secret-change-me-change-me-change-me-change-me-1234567890
    issuer: instakill-test
    ttl-minutes: 60
  notifications:
    ntfy:
      url: https://ntfy.sh
      topic: instakill-test-posts
  llm:
    host: localhost
    port: 12345
    preferred-model: google/gemma-3-270m
    timeout-seconds: 5

media:
  base-path: media-test
